name: driverwatch
description: "Protótipo de monitoramento de motorista com IA"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Câmera e permissões
  camera: ^0.10.5
  permission_handler: ^11.0.0

  # ML Kit para detecção facial (funciona no Android, iOS e Web)
  google_ml_kit: ^0.16.0

  # Alarme sonoro (toque nativo do sistema)
  flutter_ringtone_player: ^3.2.0

  # Vibração (opcional, para alerta tátil)
  vibration: ^1.8.0

  # Ícones
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true